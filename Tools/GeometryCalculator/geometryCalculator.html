<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Calculator</title>
    <link rel="icon" type="image/png" href="../../favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="shortcut icon" href="../../favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Globomath" />
    <link rel="manifest" href="../../site.webmanifest" />
    <link rel="stylesheet" href="../../css/feedback.css">
    <link rel="stylesheet" href="../../css/Common/common.css">
    <link rel="stylesheet" href="./geometryCalculator.css">
</head>
<body>
    <header>
        <nav class="navbar">
        <a href="../../index.html"><img src="../../pictures/WebsiteLogoImageLongImageV2.png" alt="" class="navImage"></a>

        <div>
            <input type="text" name="search" id="searchInput" placeholder="Search..." autocomplete="off">

            <div id="searchResults"></div>
        </div>

        <div id="navUserArea"><a href="../../html/login.html" target="_self" class="navTextBorder">Login</a>
            <a href="../../html/register.html" target="_self" class="navTextBorder">Register</a>
        </div>
    </nav>
    </header>
    <main>

        <section class="geometrySection">
            <h1 class="titleHeader">Geometry Calculator</h1>

            <div class="geometryContainer">
                <div class="geometryDivTop">
                    <div class="geometrySettingsContainer">
                        <div class="dimensionSwitchDiv">
                            <button class="dimensionTypeBtn active" data-type="2d">2D</button>
                            <button class="dimensionTypeBtn" data-type="3d">3D</button>
                        </div>

                        <div class="formSelectDiv">
                            <select name="selectForm" id="selectForm" class="selection">
                                <option value="circle">Circle</option>
                                <option value="rectangle">Rectangle</option>
                                <option value="square">Square</option>
                                <option value="triangle">General triangle</option>
                                <option value="rightTriangle">Right-angled triangle</option>
                                <option value="trapezoid">Trapezoid</option>
                                <option value="parallelogram">Parallelogram</option>
                            </select>
                        </div>
                    </div>

                    <div class="advancedSettingsContainer">
                        <button class="button" id="advancedSettingsBtn" type="button">Advanced Mode</button>
                    </div>
                </div>

                <div class="geometryInputAndFormContainer">
                    <div class="geometryLeftInputContainer">
                        <div id="variousInputContainer">
                            <div class="inputContainer">
                                <div class="inputSelectDiv">
                                    <select name="selectInput" id="selectInput" class="selection">

                                    </select>
                                </div>
                                <input type="number" id="zahlenInput" placeholder="Number" class="numberInputField">
                            </div>
                        </div>

                        <p class="errorMessagestyle" id="errorMessages"></p>


                        <div class="outputStyle" id="ausgabeContainer">
                            <div class="ergebnisGruppe">
                                <p class="ergebnisGruppenTitel">Results</p>
                                <div class="ergebnisGrid"></div>
                            </div>
                        </div>


                       <details class="calculationDetails">
                            <summary>
                                <span>
                                    <i class="fa fa-calculator" aria-hidden="true"></i>
                                    Calculation steps
                                </span>
                                <i class="fa fa-chevron-down detailsChevron" aria-hidden="true"></i>
                            </summary>
                            <div id="rechenwegOutput"></div>
                        </details> 
                    
                    </div>
                <div class="geometryRightFormContainer"></div>
            </div>
        </div>
        </section>





    </main>
    <footer>
        <div class="footerNav">

            <div class="footerSocial">
                <a href="https://twitter.com" target="_blank" rel="noopener noreferrer"><i class="fa fa-twitter"></i></a>
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer"><i class="fa fa-instagram"></i></a>
                <a href="https://youtube.com" target="_blank" rel="noopener noreferrer"><i class="fa fa-youtube-play"></i></a>
                <a href="https://github.com" target="_blank" rel="noopener noreferrer"><i class="fa fa-github"></i></a>
            </div>

            <div class="linksFooterect">
                <a href="../../html/datenSchutz.html">Data Protection</a>

                <button id="openFeedbackBtn">Feedback senden</button>

                <a href="../../html/impressum.html">Impressum</a>
            </div>

            <div class="platzhalter">&copy; 2026 MathVerse</div>
        </div>
    </footer>
    <script src="../../javaScript/Common/common-login.js"></script>
    <script src="./geometryCalculator.js"></script>
    <script src="../../javaScript/feedback.js"></script>
    <script type="module" src="../../javaScript/toolFavorite.js"></script>
    <script type="module" src="../../javaScript/search.js"></script>

    <div id="settingsModal" class="modalOverlay">
    <div class="modalContent">
        <div class="modalHeader">
            <h2>Advanced settings</h2>
            <button id="closeModalBtn" class="closeBtn">&times;</button>
        </div>
        
        <div class="modalBody">
            <div class="settingItem">
                <label for="decimalPlaces">Decimal places:</label>
                <select id="decimalPlaces" class="selection">
                    <option value="0">0</option>
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            
            </div>
        
        <div class="modalFooter">
            <button id="saveSettingsBtn" class="button">Save</button>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="icon" type="image/png" href="../../favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
    <link rel="shortcut icon" href="../../favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="../../apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Globomath" />
    <link rel="manifest" href="../../site.webmanifest" />
    <link rel="stylesheet" href="../../css/feedback.css">
    <link rel="stylesheet" href="../../css/Common/common.css">
    <link rel="stylesheet" href="./unitConverter.css">
</head>
<body>
    <header>
        <nav class="navbar">
        <a href="../../index.html"><img src="../../pictures/WebsiteLogoImageLongImageV2.png" alt="" class="navImage"></a>

        <div>
            <input type="text" name="search" id="searchInput" placeholder="Search..." autocomplete="off">

            <div id="searchResults"></div>
        </div>

        <div id="navUserArea"><a href="../../html/login.html" target="_self" class="navTextBorder">Login</a>
            <a href="../../html/register.html" target="_self" class="navTextBorder">Register</a>
        </div>
    </nav>
    </header>
    <main>



        <section class="einheitenBody">
            <h1 class="titleHeader">Unit Converter</h1>

            <div class="einheitenGruppenContainer">
                <button data-category="btnLength" class="btnUnits">Length</button>
                <button data-category="btnMass" class="btnUnits">Mass</button>
                <button data-category="btnTime" class="btnUnits">Time</button>
                <button data-category="btnArea" class="btnUnits">Area</button>
                <button data-category="btnSpeed" class="btnUnits">Speed</button>
                <button data-category="btnVolume" class="btnUnits advancedCategory">Volume</button>
                <button data-category="btnPressure" class="btnUnits advancedCategory">Pressure</button>
                <button data-category="btnEnergy" class="btnUnits advancedCategory">Energy</button>
                <button data-category="btnFrequency" class="btnUnits advancedCategory">Frequency</button>
                <button data-category="btnDecimalPrefixes" class="btnUnits advancedCategory">Decimal Prefixes</button>
                <button data-category="btnAngle" class="btnUnits advancedCategory">Plane Angle</button>
                <button data-category="btnDataSize" class="btnUnits advancedCategory">Data Size</button>
                <button data-category="btnTemperature" class="btnUnits advancedCategory">Temperature</button>
                <button data-category="btnFuelConsumption" class="btnUnits advancedCategory">Fuel Consumption</button>
            </div>

            <div class="advancedMode">
                <span class="advancedText">Advanced Mode</span>
                <!-- Rounded switch -->
                <label class="switch"><input type="checkbox"><span class="slider round"></span></label>
            </div>

            <div class="einheitsDiv">
                <input type="number" id="inputEinheit" placeholder="Enter number..." class="numberInputField">

                <select name="inputA" id="einheitA" class="selection">
                    <option value=""></option>
                </select>

                <div class="einheitenSwapRow">
                    <i class="fa fa-long-arrow-down einheitenArrow"></i>
                    <button type="button" id="swapEinheiten" class="einheitenSwapBtn" title="Einheiten tauschen">
                        <i class="fa fa-exchange"></i>
                    </button>
                </div>

                <select name="inputZ" id="einheitZ" class="selection">
                    <option value=""></option>
                </select>

                <div class="loesungsDiv"><p id="loesungOutput">Result</p></div>
            </div>
            
            <p id="errorMessages" class="errorMessagestyle"></p>

            <div class="outputStyle" id="ausgabeContainer">
                <div class="rechenwegDiv">
                    <p class="rechenwegText">Calculation steps:</p> 
                    <div id="rechenwegOutput"></div>
                </div>
            </div>
        </section>




    </main>
    <footer>
        <div class="footerNav">

            <div class="footerSocial">
                <a href="https://twitter.com" target="_blank" rel="noopener noreferrer"><i class="fa fa-twitter"></i></a>
                <a href="https://instagram.com" target="_blank" rel="noopener noreferrer"><i class="fa fa-instagram"></i></a>
                <a href="https://youtube.com" target="_blank" rel="noopener noreferrer"><i class="fa fa-youtube-play"></i></a>
                <a href="https://github.com" target="_blank" rel="noopener noreferrer"><i class="fa fa-github"></i></a>
            </div>

            <div class="linksFooterect">
                <a href="../../html/datenSchutz.html">Datenschutz</a>

                <button id="openFeedbackBtn">Feedback senden</button>

                <a href="../../html/impressum.html">Impressum</a>
            </div>

            <div class="platzhalter">&copy; 2026 MathVerse</div>
        </div>
    </footer>
    <script src="../../javaScript/Common/common-login.js"></script>
    <script src="./unitConverter.js"></script>
    <script src="../../javaScript/feedback.js"></script>
    <script type="module" src="../../javaScript/toolFavorite.js"></script>
    <script type="module" src="../../javaScript/search.js"></script>
</body>
</html>
